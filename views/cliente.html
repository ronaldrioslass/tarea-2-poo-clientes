
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
          crossorigin="anonymous">

</head>
<body class="bg-light">

    <div class="container my-5">

        <h1 class="h2 mb-4">Gestión de Clientes</h1>

        <button type="button" id="crearTabla" class="btn btn-outline-primary mb-3">Crear tabla</button>

        <!-- Mensajes de éxito o error -->
        <div id="mensaje" role="status"></div>

        <!-- Formulario -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white" id="tituloFormulario">
                Registrar cliente
            </div>

            <div class="card-body">
                <form id="formCliente">
                    <!-- Si tiene un id, estamos editando; si está vacío, es un cliente nuevo -->
                    <input type="hidden" id="id" name="id">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="nombre" class="form-label">Nombre</label>
                            <input
                                type="text"
                                class="form-control"
                                id="nombre"
                                name="nombre"
                                maxlength="100"
                                placeholder="Ej: Ana"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="apellido" class="form-label">Apellido</label>
                            <input
                                type="text"
                                class="form-control"
                                id="apellido"
                                name="apellido"
                                maxlength="100"
                                placeholder="Ej: Pérez"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="cedula" class="form-label">Cédula</label>
                            <input
                                type="text"
                                class="form-control"
                                id="cedula"
                                name="cedula"
                                inputmode="numeric"
                                pattern="[0-9]{10}"
                                maxlength="10"
                                aria-describedby="ayudaCedula"
                                required
                            >
                            <div id="ayudaCedula" class="form-text">10 números, sin guiones.</div>
                        </div>

                        <div class="col-md-6">
                            <label for="correo" class="form-label">Correo</label>
                            <input
                                type="email"
                                class="form-control"
                                id="correo"
                                name="correo"
                                maxlength="150"
                                placeholder="Ej: ana@correo.com"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input
                                type="tel"
                                class="form-control"
                                id="telefono"
                                name="telefono"
                                inputmode="numeric"
                                pattern="[0-9]{7,10}"
                                maxlength="10"
                                aria-describedby="ayudaTelefono"
                                required
                            >
                            <div id="ayudaTelefono" class="form-text">Entre 7 y 10 números.</div>
                        </div>
                    </div>

                    <div class="mt-4">
                        <button type="submit" id="botonGuardar" class="btn btn-success">
                            Guardar
                        </button>
                        <button type="button" id="botonCancelar" class="btn btn-outline-secondary ms-2" hidden>
                            Cancelar
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Tabla -->
        <div class="card">
            <div class="card-header bg-primary text-white">
                Listado de clientes
            </div>

            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-bordered table-striped align-middle">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Nombre</th>
                                <th>Apellido</th>
                                <th>Cédula</th>
                                <th>Correo</th>
                                <th>Teléfono</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>

                        <tbody id="tablaClientes">
                            <!-- Datos cargados con JavaScript -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
            crossorigin="anonymous"></script>
    <script src="clientes.js"></script>
</body>
</html>
